<!DOCTYPE html>
<html>

<head>
  <title>Delete Game | Board Game Vault</title>
</head>

<body>
  <h1>Delete Game</h1>
  <p>Game: {{ game.title }}</p>
  <p>Are you sure you want to delete this game entry?</p>
  <form action="/remove_game/{{ game.id }}" method="post">
    <input type="submit" name="remove" value="Delete" />
    <input type="submit" name="back" value="Cancel" />
  </form>
</body>

</html>
