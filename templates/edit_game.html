<!DOCTYPE html>
<html>

<head>
  <title>Edit Game | Board Game Vault</title>
</head>

<body>
  <h1>Edit Game</h1>
  <form action="/update_game" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" value ="{{ game.title }}" />
    </p>
    <p>
      Description: <br />
      <textarea name="description" rows="8" cols="60">{{ game.description }}</textarea>
    </p>
    <p>
      Year: <br />
      <input type="number" name="year" value ="{{ game.year }}" />
    </p>
    <p>
      Minimum player amount <br />
      <input type="number" name="min_player_count" value ="{{ game.min_player_count }}" />
    </p>
    <p>
      Maximum player amount <br />
      <input type="number" name="max_player_count" value ="{{ game.max_player_count }}" />
    </p>
    <p>
      Average play time (minutes): <br />
      <input type="number" name="playtime" value ="{{ game.playtime }}" />
    </p>
    <input type="hidden" name="game_id" value="{{ game.id }}" />
    <input type="submit" value="Update" />
  </form>
</body>

</html>
