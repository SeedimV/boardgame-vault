{% extends "layout.html" %}

{% block title %}New Game | {% endblock %}

{% block content %}
<h2>New Game</h2>
<form action="/create_game" method="post">
  <p>
    <label for="title">Title:</label> <br />
    <input type="text" name="title" id="title" maxlength="50" required />
  </p>
  <p>
    <label for="description">Description:</label> <br />
    <textarea id="description" name="description" rows="8" cols="60" maxlength="1000"  required></textarea>
  </p>
  <p>
    <label for="year">Year:</label> <br />
    <input type="number" id="year" name="year" min="1" max="2100" required />
  </p>
  <p>
    <label for="min_player_count">Minimum player amount:</label> <br />
    <input type="number" id="min_player_count" name="min_player_count" min="1" max="100" required />
  </p>
  <p>
    <label for="max_player_count">Maximum player amount:</label> <br />
    <input type="number" id="max_player_count" name="max_player_count" min="1" max="100" required />
  </p>
  <p>
    <label for="playtime">Average play time (minutes):</label> <br />
    <input type="number" id="playtime" name="playtime" min="1" max="10000" required />
  </p>
  {% for class in classes %}
  <p>
    <label for="class{{ class }}">{{ class }}</label>: <br />
    <select name="classes" id="class{{ class }}">
      <option value="">(Choose)</option>
      {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Add new game" />
</form>
{% endblock %}
