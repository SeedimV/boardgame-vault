{% extends "layout.html" %}

{% block title %}{% endblock %}

{% block content %}
<h2>Games</h2>


<ul>
  {% for game in games %}
  <li><a href="/game/{{ game.id }}">{{ game.title }}</a></li>
  {% endfor %}
</ul>

<p>
  <a href="/{{ page - 1 }}">&lt;&lt;</a>
  Page {{ page }}/{{ page_count }}
  <a href="/{{ page + 1 }}">&gt;&gt;</a>
</p>
<hr />
{% endblock %}
